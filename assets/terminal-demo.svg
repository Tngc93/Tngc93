<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="Terminal demo: agent-guard blocks an AI agent's destructive commands and allows safe ones">
  <title>agent-guard in action</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; white-space: pre; }
  </style>
  <rect width="860" height="340" rx="14" fill="#121927"/>
  <rect width="860" height="40" rx="14" fill="#1B2436"/>
  <rect y="26" width="860" height="14" fill="#1B2436"/>
  <circle cx="26" cy="20" r="6" fill="#FF5F57"/><circle cx="46" cy="20" r="6" fill="#FEBC2E"/><circle cx="66" cy="20" r="6" fill="#28C840"/>
  <text x="430.0" y="25" text-anchor="middle" fill="#7D8AA0" style="font-size:13px">claude-code — agent-guard</text>
  <clipPath id="c0"><rect x="26" y="60" height="24" width="0">
    <animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0429;0.1571;0.9571;1.0000" values="0;0;329.1;329.1;0"/>
  </rect></clipPath>
  <text x="28" y="78" clip-path="url(#c0)"><tspan fill="#7D8AA0">$ </tspan><tspan fill="#D9E1EA">claude</tspan><tspan fill="#FFB547"> "clean up the build output"</tspan></text>
  <clipPath id="c1"><rect x="26" y="86" height="24" width="0">
    <animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2071;0.2107;0.9571;1.0000" values="0;0;157.5;157.5;0"/>
  </rect></clipPath>
  <text x="28" y="104" clip-path="url(#c1)"><tspan fill="#8FA8FF">● </tspan><tspan fill="#D9E1EA">Bash</tspan><tspan fill="#7D8AA0">(rm -rf ~/)</tspan></text>
  <clipPath id="c2"><rect x="26" y="112" height="24" width="0">
    <animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2571;0.2607;0.9571;1.0000" values="0;0;672.2;672.2;0"/>
  </rect></clipPath>
  <text x="28" y="130" clip-path="url(#c2)"><tspan fill="#FF7A90">  ✗ agent-guard: </tspan><tspan fill="#FF7A90">blocked</tspan><tspan fill="#D9E1EA"> recursive delete of ~ would wipe your home folder</tspan></text>
  <clipPath id="c3"><rect x="26" y="138" height="24" width="0">
    <animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.3571;0.3607;0.9571;1.0000" values="0;0;229.7;229.7;0"/>
  </rect></clipPath>
  <text x="28" y="156" clip-path="url(#c3)"><tspan fill="#8FA8FF">● </tspan><tspan fill="#D9E1EA">Bash</tspan><tspan fill="#7D8AA0">(rm -rf dist .next)</tspan></text>
  <clipPath id="c4"><rect x="26" y="164" height="24" width="0">
    <animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.4071;0.4107;0.9571;1.0000" values="0;0;274.9;274.9;0"/>
  </rect></clipPath>
  <text x="28" y="182" clip-path="url(#c4)"><tspan fill="#4FE3A0">  ✓ </tspan><tspan fill="#4FE3A0">allowed</tspan><tspan fill="#7D8AA0"> inside the project</tspan></text>
  <clipPath id="c5"><rect x="26" y="190" height="24" width="0">
    <animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5000;0.5036;0.9571;1.0000" values="0;0;329.1;329.1;0"/>
  </rect></clipPath>
  <text x="28" y="208" clip-path="url(#c5)"><tspan fill="#8FA8FF">● </tspan><tspan fill="#D9E1EA">Bash</tspan><tspan fill="#7D8AA0">(git push --force origin main)</tspan></text>
  <clipPath id="c6"><rect x="26" y="216" height="24" width="0">
    <animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5500;0.5536;0.9571;1.0000" values="0;0;518.7;518.7;0"/>
  </rect></clipPath>
  <text x="28" y="234" clip-path="url(#c6)"><tspan fill="#FF7A90">  ✗ agent-guard: </tspan><tspan fill="#FF7A90">blocked</tspan><tspan fill="#D9E1EA"> force push to a protected branch</tspan></text>
  <clipPath id="c7"><rect x="26" y="242" height="24" width="0">
    <animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6429;0.6464;0.9571;1.0000" values="0;0;383.3;383.3;0"/>
  </rect></clipPath>
  <text x="28" y="260" clip-path="url(#c7)"><tspan fill="#8FA8FF">● </tspan><tspan fill="#D9E1EA">Write</tspan><tspan fill="#7D8AA0">(src/client.ts)  apiKey: "sk-ant-…"</tspan></text>
  <clipPath id="c8"><rect x="26" y="268" height="24" width="0">
    <animate attributeName="width" dur="14.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6929;0.6964;0.9571;1.0000" values="0;0;545.8;545.8;0"/>
  </rect></clipPath>
  <text x="28" y="286" clip-path="url(#c8)"><tspan fill="#FF7A90">  ✗ agent-guard: </tspan><tspan fill="#FF7A90">blocked</tspan><tspan fill="#D9E1EA"> hard-coded API key, use an env file</tspan></text>
  <text x="28" y="312" fill="#7D8AA0">$<animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" keyTimes="0;0.7357;0.7364;0.9571;1" values="0;0;1;1;0" calcMode="discrete"/></text>
  <rect width="9" height="18" rx="1.5" fill="#4FE3A0">
    <animate attributeName="x" dur="14.0s" repeatCount="indefinite" keyTimes="0.0000;0.0429;0.1571;0.7357;0.7364;1.0000" values="46.1;46.1;355.1;355.1;46.1;46.1"/>
    <animate attributeName="y" dur="14.0s" repeatCount="indefinite" keyTimes="0.0000;0.0429;0.1571;0.7357;0.7364;1.0000" values="63;63;63;63;297;297" calcMode="discrete"/>
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite" keyTimes="0;0.5;1" values="1;0;1" calcMode="discrete"/>
  </rect>
</svg>
